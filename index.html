      <div class="reading-column">
        <header class="article-header">
          <h1 aria-label="杂谈 #T001"><span class="title-character" aria-hidden="true">杂</span><span class="title-character" aria-hidden="true">谈</span><span class="issue-number" aria-hidden="true">#T001</span></h1>

    <section class="music-player" id="music-player" aria-label="背景音乐">
      <button class="music-toggle" id="music-toggle" type="button" aria-label="播放背景音乐" aria-pressed="false">

        <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5h3v14H8zm6 0h3v14h-3z" /></svg>

      </div>

      <div class="music-track" aria-hidden="true"><span id="music-progress"></span></div>
      <audio id="background-music" autoplay loop preload="auto"></audio>
    </section>

    <dialog class="photo-dialog" id="photo-dialog" aria-label="查看照片">
      <div class="photo-dialog-toolbar">
        <span id="photo-dialog-count"></span>
